name: AETHER browser performance and production smoke
on:
  pull_request:
    paths:
      - 'templates/index.html'
      - 'tests/test_dashboard_security.cjs'
      - 'tests/test_interactive_dom.cjs'
      - '.github/workflows/browser-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Verify archive and interactive DOM safety
        run: |
          node tests/test_dashboard_security.cjs
          node tests/test_interactive_dom.cjs
  production-smoke:
    # External observations of the deployed service; these do not validate PR code.
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Measure initial homepage and health responses (homepage first)
        shell: bash
        run: |
          set -euo pipefail
          # The first request in this job must be the homepage so its TTFB
          # captures any free-tier wake-up delay instead of hiding it behind /health.
          metrics=$(curl -sS -L --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 12 --max-time 100 \
            -o "$RUNNER_TEMP/home.html" -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' \
            https://aether-infinity.onrender.com/)
          read -r code ttfb total bytes <<< "$metrics"
          echo "Initial GET / (homepage-first): HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
          test "$code" = 200
          grep -q 'AETHER' "$RUNNER_TEMP/home.html"
          metrics=$(curl -sS -L --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 12 --max-time 100 \
            -o "$RUNNER_TEMP/health.json" -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' \
            https://aether-infinity.onrender.com/health)
          read -r code ttfb total bytes <<< "$metrics"
          echo "Follow-on GET /health: HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
          test "$code" = 200
          python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ok"' "$RUNNER_TEMP/health.json"
      - name: Measure follow-up health, homepage, and archive
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in health homepage archive; do
            case "$endpoint" in
              health) url="https://aether-infinity.onrender.com/health" ;;
              homepage) url="https://aether-infinity.onrender.com/" ;;
              archive) url="https://raw.githubusercontent.com/youreejerry7-wq/aether-infinity/main/data/research.json" ;;
            esac
            output="$RUNNER_TEMP/followup-$endpoint"
            metrics=$(curl -sS -L --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 12 --max-time 100 --max-filesize 2000000 \
              -o "$output" -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' "$url")
            read -r code ttfb total bytes <<< "$metrics"
            echo "Follow-up GET $endpoint: HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
            test "$code" = 200
            case "$endpoint" in
              health) python3 -c 'import json,sys; assert json.load(open(sys.argv[1]))["status"] == "ok"' "$output" ;;
              homepage) grep -q 'AETHER' "$output" ;;
              archive) python3 -c 'import json,sys; a=json.load(open(sys.argv[1])); assert isinstance(a,list) and len(a)>0; print("Archive cycles observed:",len(a))' "$output" ;;
            esac
          done
