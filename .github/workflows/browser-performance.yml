name: AETHER browser efficiency check
on:
  pull_request:
    paths:
      - 'templates/index.html'
      - 'tests/test_frontend_perf.cjs'
      - '.github/workflows/browser-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify cached, visibility-aware polling
        run: node tests/test_frontend_perf.cjs
