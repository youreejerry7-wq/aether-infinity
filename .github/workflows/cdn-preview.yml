name: AETHER CDN preview checks
on:
  pull_request:
    paths:
      - 'cdn-preview/**'
      - 'tests/test_cdn_preview.cjs'
      - 'tests/test_archive_diff_guard.cjs'
      - 'tests/measure_public_latency.py'
      - 'tests/test_measure_public_latency.py'
      - 'data/research.json'
      - '.github/workflows/cdn-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Test archive guard against base-branch updates
        run: node --test tests/test_archive_diff_guard.cjs
      - name: Reject changes to the scheduled research archive
        if: github.event_name == 'pull_request'
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # The PR event's base SHA can predate later scheduled archive updates.
          # Compare against the current base branch so a review-branch sync does
          # not look like an unauthorized archive edit.
          git fetch --no-tags origin "+refs/heads/${PR_BASE_REF}:refs/remotes/origin/${PR_BASE_REF}"
          if git diff --quiet "origin/${PR_BASE_REF}...${PR_HEAD_SHA}" -- data/research.json; then
            echo "PASS: PR does not modify the scheduled research archive."
          else
            echo "::error::This PR modifies data/research.json; archive data is maintained only by the scheduled research workflow."
            exit 1
          fi
      - name: Test cache, throttling, visibility, bounds, and safe rendering
        run: node --test tests/test_cdn_preview.cjs
      - name: Test compressed and identity HTTP body decoding
        run: python -m unittest discover -s tests -p 'test_measure_public_latency.py'
      - name: Verify the public archive supports browser cross-origin reads
        shell: bash
        run: |
          set -euo pipefail
          archive_url="https://raw.githubusercontent.com/youreejerry7-wq/aether-infinity/main/data/research.json"
          curl --fail --silent --show-error --location \
            --dump-header "$RUNNER_TEMP/archive.headers" \
            --output "$RUNNER_TEMP/research.json" \
            --write-out 'HTTP %{http_code}; bytes=%{size_download}; total=%{time_total}s\\n' \
            "$archive_url"
          # The frontend uses cache: "default"; require a positive origin cache lifetime.
          grep -Eiq '^cache-control:.*max-age=[1-9][0-9]*' "$RUNNER_TEMP/archive.headers"
          grep -Ei '^cache-control:|^etag:' "$RUNNER_TEMP/archive.headers"
          grep -Eiq '^access-control-allow-origin:[[:space:]]*\\*([[:space:]]|$)' "$RUNNER_TEMP/archive.headers"
          python - "$RUNNER_TEMP/research.json" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              archive = json.load(handle)
          assert isinstance(archive, list) and archive, "archive must be a nonempty list"
          latest = archive[0]
          assert isinstance(latest, dict), "latest cycle must be an object"
          assert isinstance(latest.get("experiments"), list), "latest experiments must be a list"
          print(f"Archive JSON valid: {len(archive)} cycles; latest timestamp present={bool(latest.get('time'))}")
          PY
          node - "$RUNNER_TEMP/research.json" <<'NODE'
          const fs = require("node:fs");
          const { isUsableArchive } = require("./cdn-preview/app.js");
          const archive = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          if (!isUsableArchive(archive)) {
            throw new Error("CDN preview rejects the live public archive schema");
          }
          console.log(`CDN preview accepts live archive schema (${archive.length} cycles)`);
          NODE
      - name: Measure first and repeat AETHER latency and payloads (read-only)
        run: python3 tests/measure_public_latency.py

  static-site-smoke:
    # Read-only external verification of the separately deployed staging site.
    # This does not validate or replace the existing Flask production service.
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the isolated Render Static Site over public HTTP
        shell: bash
        run: |
          set -euo pipefail
          base="https://aether-cdn-preview.onrender.com"
          code=""
          for attempt in $(seq 1 12); do
            if metrics=$(curl -sS -L --connect-timeout 5 --max-time 8 \
              -D "$RUNNER_TEMP/cdn-preview.headers" \
              -o "$RUNNER_TEMP/cdn-preview.html" \
              -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' "$base/"); then
              read -r code ttfb total bytes <<< "$metrics"
              echo "static_home attempt=$attempt HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
              if [ "$code" = "200" ]; then break; fi
            fi
            sleep 5
          done
          test "$code" = "200"
          grep -q '<h1>AETHER ∞</h1>' "$RUNNER_TEMP/cdn-preview.html"
          grep -q 'script src="./app.js"' "$RUNNER_TEMP/cdn-preview.html"
          grep -Ei '^content-type:|^cache-control:' "$RUNNER_TEMP/cdn-preview.headers" || true

          metrics=$(curl -sS -L --connect-timeout 5 --max-time 12 \
            -o "$RUNNER_TEMP/cdn-preview.js" \
            -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' "$base/app.js")
          read -r code ttfb total bytes <<< "$metrics"
          echo "static_js HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
          test "$code" = "200"
          grep -q 'raw.githubusercontent.com/youreejerry7-wq/aether-infinity/main/data/research.json' "$RUNNER_TEMP/cdn-preview.js"
          if grep -Eq '/api/run|/api/results|/health' "$RUNNER_TEMP/cdn-preview.js"; then
            echo "::error::Static preview unexpectedly references Flask API routes."
            exit 1
          fi

          metrics=$(curl -sS -L --connect-timeout 5 --max-time 12 \
            -o "$RUNNER_TEMP/cdn-preview-repeat.html" \
            -w '%{http_code} %{time_starttransfer} %{time_total} %{size_download}' "$base/")
          read -r code ttfb total bytes <<< "$metrics"
          echo "static_home_repeat HTTP=$code ttfb_seconds=$ttfb total_seconds=$total bytes=$bytes"
          test "$code" = "200"
          grep -q '<h1>AETHER ∞</h1>' "$RUNNER_TEMP/cdn-preview-repeat.html"
