name: AETHER offline Python regression tests
on:
  pull_request:
    paths:
      - 'app.py'
      - 'research.py'
      - 'tests/test_app.py'
      - 'tests/test_research.py'
      - 'requirements.txt'
      - '.github/workflows/python-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install existing dependencies and test runner
        run: python -m pip install -r requirements.txt pytest
      - name: Verify Flask routes and seeded statistical baselines (offline)
        run: python -m pytest -q tests/test_app.py tests/test_research.py
