name: AETHER scheduled research
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aether-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      # Full regression tests run on pull requests; keep the hourly synthetic cycle lean.
      - name: Execute scheduled research cycle
        run: python research.py
      - name: Validate generated research archive before committing
        run: python -m unittest discover -s tests -p 'test_research_archive.py' -v
      - name: Commit results if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research.json data/research-latest.json
          # Synthetic archive updates are not application releases.
          # Render recognizes [skip render] on connected Git-provider auto-deploys.
          git diff --cached --quiet || (git commit -m "Record scheduled research cycle [skip render]" && git push)
