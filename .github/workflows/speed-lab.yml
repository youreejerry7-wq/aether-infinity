name: AETHER speed lab tests

on:
  pull_request:
    paths:
      - 'speed_lab.py'
      - 'tests/test_speed_lab*.py'
      - '.github/workflows/speed-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test variance reduction methods and independent references
        run: python -m unittest discover -s tests -p 'test_speed_lab*.py' -v
      - name: Show reproducible benchmark
        run: python speed_lab.py --samples 10000 --replicates 24 --seed 2026

      # Twenty short trials improve the RMSE estimate while remaining within
      # the benchmark's two-million-sampling-unit cap for the 5 ms target.
      - name: Show measured matched-time trials (seed 2026)
        run: python speed_lab.py --matched-seconds 0.005 --replicates 20 --seed 2026
      - name: Repeat matched-time trials with an independent seed
        run: python speed_lab.py --matched-seconds 0.005 --replicates 20 --seed 2027
