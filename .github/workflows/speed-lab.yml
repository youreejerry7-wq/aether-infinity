name: AETHER speed lab tests

on:
  pull_request:
    paths:
      - 'speed_lab.py'
      - 'tests/test_speed_lab.py'
      - '.github/workflows/speed-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test variance reduction methods
        run: python -m unittest discover -s tests -p 'test_speed_lab.py' -v
      - name: Show reproducible benchmark
        run: python speed_lab.py --samples 10000 --replicates 24 --seed 2026
