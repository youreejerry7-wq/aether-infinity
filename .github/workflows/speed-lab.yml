name: AETHER speed lab tests

on:
  pull_request:
    paths:
      - 'speed_lab.py'
      - 'tests/test_speed_lab*.py'
      - '.github/workflows/speed-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Test variance reduction methods and independent references
        run: python -m unittest discover -s tests -p 'test_speed_lab*.py' -v
      - name: Show reproducible benchmark
        run: python speed_lab.py --samples 10000 --replicates 30 --seed 2026

      # Use the CLI's maximum bounded 30 replications so the percentile intervals
      # are not in the explicitly exploratory <30 regime. This remains a single-
      # runner estimate; it does not capture cross-machine uncertainty.
      # Request a 5 ms target. Faster runners may proportionally scale the
      # per-method counts to respect the shared cap; the report must expose the
      # scale and actual timings. Validate the hard budget, not a machine-specific
      # calibration outcome.
      - name: Show measured matched-time trials (seed 2026)
        run: |
          python speed_lab.py --matched-seconds 0.005 --replicates 30 --seed 2026 | tee matched-2026.json
          python -c 'import json; d=json.load(open("matched-2026.json")); assert 0 < d["sampling_budget_scale_factor"] <= 1; assert d["total_sampling_units_including_calibration"] <= d["sampling_unit_budget"]; assert d["replications"] == 30 and all(v["median_observed_seconds"] > 0 for v in d["results"].values()); print("budget_scale_factor:", d["sampling_budget_scale_factor"])'
      - name: Repeat matched-time trials with an independent seed
        run: |
          python speed_lab.py --matched-seconds 0.005 --replicates 30 --seed 2027 | tee matched-2027.json
          python -c 'import json; d=json.load(open("matched-2027.json")); assert 0 < d["sampling_budget_scale_factor"] <= 1; assert d["total_sampling_units_including_calibration"] <= d["sampling_unit_budget"]; assert d["replications"] == 30 and all(v["median_observed_seconds"] > 0 for v in d["results"].values()); print("budget_scale_factor:", d["sampling_budget_scale_factor"])'
